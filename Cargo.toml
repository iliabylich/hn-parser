[package]
edition = "2024"
license = "MIT"
name = "hnparser"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
lettre = { version = "0.11", default-features = false, features = [
  "smtp-transport",
  "hostname",
  "builder",
  "tokio1-rustls",
  "ring",
  "webpki-roots",
] }
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-perl",
  "unicode-case",
] }
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "ring",
  "tls12",
  "webpki-tokio",
] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
timeago = { version = "0.6", default-features = false }
tokio = { version = "1.0", features = ["rt", "macros", "fs", "net", "sync", "time"] }
toml = { version = "1.0", default-features = false, features = ["std", "parse", "serde"] }
log = "0.4.27"
env_logger = { version = "0.11.8", default-features = false }

[profile.release]
opt-level = "z"
lto = true

[package.metadata.deb]
assets = [
  [
    "target/release/hnparser",
    "usr/bin/hnparser",
    "755",
  ],
  [
    "debian/hnparser.service",
    "lib/systemd/system/hnparser.service",
    "644",
  ],
]
copyright = "2023, Ilya Bylich."
depends = "$auto, systemd"
extended-description = "HN parser"
maintainer = "HN parser developer <ibylich@gmail.com>"
maintainer-scripts = "debian/scripts"
priority = "optional"
section = "admin"
